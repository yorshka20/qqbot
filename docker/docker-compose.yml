name: qqbot

# Required for QQ. `docker compose up` starts only these two.
# Optional sidecars (SearXNG, Qdrant, WeChat) are in docker-compose.optional.yml.
# Secrets live in docker/.env (gitignored). See README → Deploy.
#
# PMHQ is privileged because the image runs the QQ desktop client.

services:
  pmhq:
    image: ${LLBOT_IMAGE_PREFIX:-}linyuchen/pmhq:${PMHQ_TAG:-latest}
    container_name: pmhq
    privileged: true
    environment:
      AUTO_LOGIN_QQ: ${AUTO_LOGIN_QQ:-}
      PMHQ_AUTH_TOKEN: ${LLBOT_AUTH_TOKEN:-}
    volumes:
      - qq_volume:/root/.config/QQ
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  llbot:
    image: ${LLBOT_IMAGE_PREFIX:-}linyuchen/llbot:${LLBOT_TAG:-latest}
    container_name: llbot
    ports:
      - "${LLBOT_WEBUI_PORT:-3080}:${LLBOT_WEBUI_PORT:-3080}"
      - "${LLBOT_MILKY_PORT:-3010}:${LLBOT_MILKY_PORT:-3010}"
      - "${LLBOT_OB11_PORT:-3001}:${LLBOT_OB11_PORT:-3001}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEBUI_PORT: ${LLBOT_WEBUI_PORT:-3080}
      PROTOCOL_MODE: pmhq
      PMHQ_HOST: pmhq
    volumes:
      - ./llbot_config:/app/llbot/data:rw
    depends_on:
      pmhq:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:'+(process.env.WEBUI_PORT||3080)).then(()=>process.exit(0),()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  qq_volume:

networks:
  app_network:
    driver: bridge
